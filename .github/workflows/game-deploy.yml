name: Deploy HUNG PARLIAMENT

on:
  push:
    branches: [main]
    paths: ['game/**', 'maps/**', '.github/workflows/game-deploy.yml']
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: game-deploy
  cancel-in-progress: false

jobs:
  # The deploy only runs when the full CI (typecheck, unit/integration tests, maps tests, web build, cdk synth, e2e)
  # passes for this commit. ci.yml is a reusable workflow, so the checks are defined once.
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: game
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game/package-lock.json
      - run: npm ci
      - run: npm run gen:maps
      - run: npm run build -w @hp/web
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-south-1
      - name: CDK deploy
        working-directory: game/infra
        run: npx cdk deploy --all --require-approval never -c stage=prod
