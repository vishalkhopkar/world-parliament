name: Deploy HUNG PARLIAMENT

on:
  push:
    branches: [main]
    paths: ['game/**', 'maps/**', '.github/workflows/game-deploy.yml']
  workflow_dispatch:
    inputs:
      stage:
        description: Stage to deploy
        type: choice
        options: [prod, dev]
        default: prod

permissions:
  id-token: write
  contents: read

concurrency:
  group: game-deploy
  cancel-in-progress: false

jobs:
  # The deploy only runs when the full CI (typecheck, unit/integration tests, maps tests, web build, cdk synth, e2e)
  # passes for this commit. ci.yml is a reusable workflow, so the checks are defined once.
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: game
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game/package-lock.json
      - run: npm ci
      - run: npm run gen:maps
      - run: npm run gen:config
      - run: npm run build -w @hp/web
      - name: Check AWS secret is configured
        env:
          ROLE: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        run: |
          if [ -z "$ROLE" ]; then
            echo "::error::Repo secret AWS_DEPLOY_ROLE_ARN is not set. See game/infra/README.md (One-time AWS setup)."
            exit 1
          fi
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-south-1
      - name: CDK deploy
        working-directory: game/infra
        env:
          STAGE: ${{ inputs.stage || 'prod' }}
          ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
        run: |
          extra=""
          if [ -n "$ALERT_EMAIL" ]; then extra="-c alertEmail=$ALERT_EMAIL"; fi
          npx cdk deploy --all --require-approval never -c stage=$STAGE $extra --outputs-file cdk-outputs.json
      # The web bundle is built before the stacks exist, so it cannot know the API URLs: it would fall back to the
      # in-browser mock. Now that they exist, rebuild with them and redeploy only the Web stack.
      - name: Rebuild web with the API URLs and redeploy the Web stack
        working-directory: game
        env:
          STAGE: ${{ inputs.stage || 'prod' }}
        run: |
          out=infra/cdk-outputs.json
          export VITE_API_URL=$(node -p "require('./$out')['HungParliament-$STAGE-Api'].HttpApiUrl")
          export VITE_WS_URL=$(node -p "require('./$out')['HungParliament-$STAGE-Api'].WebSocketUrl")
          npm run build -w @hp/web
          cd infra
          npx cdk deploy "HungParliament-$STAGE-Web" --exclusively --require-approval never -c stage=$STAGE
      - name: Summary and smoke test
        working-directory: game/infra
        env:
          STAGE: ${{ inputs.stage || 'prod' }}
        run: |
          node summarize-outputs.mjs
          url=$(cat site-url.txt)
          ok=""
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$url/")
            if [ "$code" = 200 ]; then ok=1; break; fi
            sleep 10
          done
          [ -n "$ok" ] || { echo "::error::Smoke test failed for $url (last status $code)"; exit 1; }
          # the live bundle must point at the real API, not the in-browser mock
          api=$(node -p "require('./cdk-outputs.json')['HungParliament-$STAGE-Api'].HttpApiUrl")
          js=$(curl -s "$url/" | grep -o 'assets/[^"]*\.js' | head -1)
          curl -s "$url/$js" | grep -q "$api" || { echo "::error::Deployed bundle does not contain the API URL ($api): it would run in mock mode"; exit 1; }
