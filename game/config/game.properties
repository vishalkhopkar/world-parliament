# HUNG PARLIAMENT - game constants.  EDIT THIS FILE to tune the game; no code changes needed.
#
# After editing, the values are picked up automatically by:
#   npm test / npm run build         (they regenerate shared/src/config.generated.ts first)
#   npm run dev (server) and vite    (same, via the "predev" hook)
# or run it by hand from game/:      npm run gen:config
# (npm run check:config fails if shared/src/config.generated.ts is out of date with this file.)
#
# Format: key=value, one per line. '#' starts a comment. Numbers may use '_' for readability (50_000).
# Money is in whole World Rupees (W₹). These values apply to every map; seat count and map id come from the map itself.

# ---- Currency -------------------------------------------------------------------------------------------------
currency.name=World Rupee
currency.symbol=W₹

# ---- Money ----------------------------------------------------------------------------------------------------
# Starting budget of every player.
budget=50_000
# What an action costs.
costs.rally=2_000
costs.roadshow=400

# ---- Analyst report prices (linear from campaign start to campaign end) -------------------------------------
analyst.seatReport.start=800
analyst.seatReport.end=1_800
analyst.globalReport.start=2_800
analyst.globalReport.end=6_200
# Reports describe the position this many milliseconds before purchase.
analyst.delayMs=30_000
# Relative noise (standard deviation) of report estimates, and the margin of error shown (multiple of the noise).
analyst.noise=0.07
analyst.marginFactor=1.0

# ---- Effect of a RALLY -------------------------------------------------------------------------------------------
# Effect in the seat where the rally is held.
effects.rally.local=1.0
# Added to EVERY seat in the world (news / social media), including the rally seat.
effects.rally.global=0.01
# Spill-over to other seats = local x 0.5^(distance / halfDistanceKm); 0 beyond maxKm; never above capRatio x local.
effects.rally.decay.halfDistanceKm=150
effects.rally.decay.maxKm=800
effects.rally.decay.capRatio=0.5

# ---- Effect of a ROADSHOW --------------------------------------------------------------------------------------
# Effect in the seat of the roadshow (must be larger than rally.global and rally.local).
effects.roadshow.local=3.0
effects.roadshow.decay.halfDistanceKm=40
effects.roadshow.decay.maxKm=200
effects.roadshow.decay.capRatio=0.4

# ---- First mover's advantage -------------------------------------------------------------------------------------
# The very first party to campaign (rally OR roadshow) in a seat gets this bonus effect in THAT seat, on top of the
# normal effect of the action. The bonus depends on which action the first mover used. Not multiplied by the time
# bonus. Set both to 0 to switch the first mover's advantage off.
effects.firstMover.rally=0.5
effects.firstMover.roadshow=1.5

# ---- Time bonus --------------------------------------------------------------------------------------------------
# Every effect is multiplied by a factor rising linearly from start (campaign start) to end (campaign end).
timeMultiplier.start=1.0
timeMultiplier.end=1.1

# ---- Voting ------------------------------------------------------------------------------------------------------
# Small random swing applied to each seat's shares at polling (0.02 = up to about +/-2% relative).
randomSwing=0.02

# ---- Polling phases and players ------------------------------------------------------------------------------
phases.min=1
phases.max=5
phases.default=3
players.min=2
players.max=10

# ---- Durations (milliseconds) -------------------------------------------------------------------------------
durations.campaignMs=600_000
durations.countingMs=180_000
durations.postCountingMs=120_000
durations.graceMs=90_000

# ---- Points (who wins a coalition) ---------------------------------------------------------------------------
# Seat points for a government party = round(seatMultiplier x seats / N).
points.seatMultiplier=200
# Flat points for being in the government at all, and for being in opposition.
points.governmentFloor=10
points.opposition=0
# Portfolios, numbered 1..n in display order. 'max' = how many players may hold it.
points.portfolios.1.id=PM
points.portfolios.1.label=Prime Minister
points.portfolios.1.points=100
points.portfolios.1.max=1
points.portfolios.2.id=DPM
points.portfolios.2.label=Deputy Prime Minister
points.portfolios.2.points=50
points.portfolios.2.max=2
points.portfolios.3.id=HOME
points.portfolios.3.label=Home
points.portfolios.3.points=20
points.portfolios.3.max=1
points.portfolios.4.id=DEFENCE
points.portfolios.4.label=Defence
points.portfolios.4.points=20
points.portfolios.4.max=1
points.portfolios.5.id=FINANCE
points.portfolios.5.label=Finance
points.portfolios.5.points=20
points.portfolios.5.max=1
points.portfolios.6.id=EXTERNAL
points.portfolios.6.label=External Affairs
points.portfolios.6.points=20
points.portfolios.6.max=1
points.portfolios.7.id=SPEAKER
points.portfolios.7.label=Speaker of Parliament
points.portfolios.7.points=10
points.portfolios.7.max=1
