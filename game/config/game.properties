# HUNG PARLIAMENT - game constants.  EDIT THIS FILE to tune the game; no code changes needed.
#
# After editing, the values are picked up automatically by:
#   npm test / npm run build         (they regenerate shared/src/config.generated.ts first)
#   npm run dev (server) and vite    (same, via the "predev" hook)
# or run it by hand from game/:      npm run gen:config
# (npm run check:config fails if shared/src/config.generated.ts is out of date with this file.)
#
# Format: key=value, one per line. '#' starts a comment. Numbers may use '_' for readability (50_000).
# Money is in whole World Rupees (W₹). These values apply to every map; seat count and map id come from the map itself.

# ---- Client connection ---------------------------------------------------------------------------------------
# While a player's browser has lost its connection (phone tab/app backgrounded, network blip) it retries by itself this
# often, in milliseconds (min 1000). Each retry is one small WebSocket connect; retries pause while the page is hidden.
connection.retryMs=5_000

# ---- Messaging (counting and post-counting phases, games with 3+ players) ----------------------------------------
# group      = ONE common group chat: every message is read by everybody in the game (default).
# individual = private threads: a message goes only to the recipients the sender picks.
messaging.mode=group
# When the chat opens: campaign = from the start of the campaign (default), counting = only once counting starts.
# Coalition offers always open when counting starts. Chat is never available with only 2 players.
messaging.opensAt=campaign

# ---- Currency -------------------------------------------------------------------------------------------------
currency.name=World Rupee
currency.symbol=₩

# ---- Money ----------------------------------------------------------------------------------------------------
# Starting budget of every player.
budget=60_000
# What an action costs.
# How the prices were derived (effects below, real seat centres of the world-500 map, every seat taken in turn as the
# home seat, effect summed over all 500 seats): a rally = 0.25 x 500 + 16.27 (Gaussian part) = 141.3, a roadshow = 6.28,
# so one rally is worth y = 141.3 / 6.28 = 22.5 roadshows. A rally "should" cost 0.80y-0.85y of a roadshow
# (18.0-19.1 x 400 = 7,190-7,640 at a roadshow of 400); the designer chose 8,000 = 20 roadshows = 0.89y.
# About 89% of a rally's total comes from the uniform 0.25 floor. The time multiplier cancels out of this ratio.
costs.rally=8_000
costs.roadshow=400

# ---- Cooldowns ---------------------------------------------------------------------------------------------------
# Minimum gap, in milliseconds, between two rallies of the SAME player (the leader has to be present at the rally).
# Roadshows have no cooldown. 0 switches the rally cooldown off.
cooldowns.rallyMs=15_000

# ---- Analyst reports ---------------------------------------------------------------------------------------------
# Switches for the two analyst reports. true = players can buy it, false = temporarily switched off: the buy is refused by the
# server, and the web app / AI agent hide it. Exactly `true` or `false`.
# seatReport = the local report on one seat; globalReport = the all-seats report.
analyst.seatReport.enabled=false
analyst.globalReport.enabled=false
# Prices (linear from campaign start to campaign end)
analyst.seatReport.start=800
analyst.seatReport.end=1_800
analyst.globalReport.start=2_800
analyst.globalReport.end=6_200
# Reports describe the position this many milliseconds before purchase.
analyst.delayMs=30_000
# Relative noise (standard deviation) of report estimates, and the margin of error shown (multiple of the noise).
analyst.noise=0.07
analyst.marginFactor=1.0

# ---- Spread of an action over the map ---------------------------------------------------------------------------
# Both actions spread over the world as a Gaussian (bell curve) in the distance between seat centres (great-circle km).
# Distances are measured in units of this many km:  x = distance_km / effects.distanceUnitKm.
effects.distanceUnitKm=100

# ---- Effect of a RALLY -------------------------------------------------------------------------------------------
# Effect of a rally at a seat = rally.global + rally.local x exp(-rally.decay.spread x x^2)
#   global : added to EVERY seat in the world (news / social media), including the rally seat, however far away.
#   local  : peak of the Gaussian, i.e. the effect in the seat where the rally is held (x = 0).
#   spread : how fast it falls with distance: larger = narrower bell. At 0.1 the Gaussian part is 100% at 0 km, 90% at
#            100 km, 67% at 200 km, 41% at 300 km, 20% at 400 km, 2.7% at 600 km (standard deviation about 224 km).
#   maxKm  : beyond this distance the Gaussian part is set to exactly 0 (the seat keeps only the global part).
effects.rally.global=0.25
effects.rally.local=10
effects.rally.decay.spread=0.1
effects.rally.decay.maxKm=700

# ---- Effect of a ROADSHOW --------------------------------------------------------------------------------------
# A roadshow is purely LOCAL: its effect is roadshow.local in the seat where it is held and exactly 0 in every other
# seat (no global part, no spill-over). The decay keys are kept only because the engine reads them: maxKm=0 switches the
# spill-over off (any other seat is farther than 0 km); spread is then unused.
#   local  : effect in the seat where the roadshow is held (6.25 x display.reputationScale 4 = 25 shown).
effects.roadshow.local=6.25
effects.roadshow.decay.spread=2.8
effects.roadshow.decay.maxKm=0

# ---- First mover's advantage -------------------------------------------------------------------------------------
# The very first party to campaign (rally OR roadshow) in a seat gets this bonus effect in THAT seat, on top of the
# normal effect of the action. The bonus depends on which action the first mover used. Not multiplied by the time
# bonus. Set both to 0 to switch the first mover's advantage off.
effects.firstMover.rally=0.2
effects.firstMover.roadshow=0.2

# ---- Time bonus --------------------------------------------------------------------------------------------------
# Every effect is multiplied by a factor rising linearly from start (campaign start) to end (campaign end).
timeMultiplier.start=1.0
timeMultiplier.end=1.05

# ---- Committed voters ----------------------------------------------------------------------------------------------
# Every party gets committed voters in a patch of seats around a random core seat (distinct per party), dealt when the
# player is admitted. Bands are numbered 1..n and filled in order by a breadth-first walk from the core: band 1 = the
# core + the nearest seats, then band 2, ... percent = share of the seat's voters committed to the party; seats = how
# many seats get this band; level = HIGH / MEDIUM / LOW (colour shade on the map and the label in the seat panel).
committed.bands.1.percent=30
committed.bands.1.seats=5
committed.bands.1.level=HIGH
committed.bands.2.percent=25
committed.bands.2.seats=7
committed.bands.2.level=HIGH
committed.bands.3.percent=20
committed.bands.3.seats=10
committed.bands.3.level=MEDIUM
committed.bands.4.percent=15
committed.bands.4.seats=15
committed.bands.4.level=MEDIUM
committed.bands.5.percent=10
committed.bands.5.seats=20
committed.bands.5.level=LOW
committed.bands.6.percent=5
committed.bands.6.seats=30
committed.bands.6.level=LOW
# Parties' bands may overlap in a seat, but a seat is skipped (the walk goes on past it) if the band would take the
# seat's committed total above this percentage.
committed.seatMaxPercent=60

# ---- Voting ------------------------------------------------------------------------------------------------------
# A seat's votes, in order: (1) committed voters; (2) influence: each committed party brings extra voters, a random
# 0..influenceMaxPercent % of its committed voters (30% committed at 40 -> up to 12 extra per 100); (3) randomness: a
# random 0..(randomMaxPercent x number of parties) % of the remaining (uncommitted) voters vote for random parties in
# random amounts (7 parties at 5 -> up to 35%);
# (4) everyone left votes by reputation (rallies and roadshows): party share = its reputation / total reputation
# there, or at random when nobody has any reputation in the seat. First past the post; exact ties are broken at random.
voting.influenceMaxPercent=40
voting.randomMaxPercent=5

# ---- Display -------------------------------------------------------------------------------------------------------
# The reputation a player sees for themselves in a seat (badge on the map, seat panel) = the engine's reputation x this,
# rounded to a whole number. At 4 the rally floor (0.25 in every seat) is shown as 1, and a rally in its own seat
# (10.25) as 41.
display.reputationScale=4

# ---- Polling phases and players ------------------------------------------------------------------------------
phases.min=1
phases.max=5
phases.default=3
players.min=2
players.max=10

# ---- Durations (milliseconds) -------------------------------------------------------------------------------
durations.campaignMs=300_000
durations.countingMs=180_000
# Counting lasts this long instead when the game has exactly 2 players (no negotiation, so no need for 3 minutes).
durations.countingMsTwoPlayers=60_000
# One counting step (the reveal is updated this often). Shorter = smoother, more updates.
durations.countingStepMs=1_000
durations.postCountingMs=120_000
# Post-counting (negotiation) time when the game has exactly 2 players. There is no negotiation with 2 players, so 0 =
# the result screen follows immediately when counting ends.
durations.postCountingMsTwoPlayers=0
durations.graceMs=90_000

# ---- Counting (how results are revealed over the counting time) --------------------------------------------
# Seats first show only a LEAD (which can be wrong early on); a seat is CONFIRMED (won) only from winStartFraction of the
# counting time, and the confirmed winner is always the true result. Fractions are of the whole counting time.
counting.winStartFraction=0.75
# Every seat shows a lead (however noisy) no later than this fraction of the counting time.
counting.allLeadsByFraction=0.5
# Noise of a displayed lead: the estimated score of a party = its true share x exp(sigma x gaussian). sigma starts at
# leadNoiseStart and falls as (1 - elapsed)^leadNoiseExponent, reaching 0 just before the seat is confirmed. High = the lead can be anyone early on.
counting.leadNoiseStart=2.0
counting.leadNoiseExponent=2
# A lead can only change this often (fraction of the counting time), so it does not flicker every second.
counting.leadNoiseEpochFraction=0.05
# Seats are confirmed safest first (biggest winning margin). This much random jitter (in vote-share points, 0.35 = 35 points) is added to the margin to shuffle the order.
counting.winJitter=0.35

# ---- Counting screen display (what players see while the count is on) -------------------------------------------
# Seat vote-share pie chart (click a seat that has a lead or a result): while it is open on a LEADING seat the shares are
# fetched again this often (ms, min 250), so the slices swing. A confirmed seat never changes.
counting.pieRefreshMs=1_000
# Result panels (desktop, left of the map): every card stays this long (ms)...
counting.panelDisplayMs=5_000
# ...and panel k (top = 0) first appears k x this many ms after the top one, and keeps that offset when it refreshes.
counting.panelStaggerMs=500
# A TRAILS / LOST card shows the seat's runner-up this % of the time, otherwise a random other non-leading party.
# The two percentages must add up to 100.
counting.panelRunnerUpPercent=75
counting.panelOtherPercent=25

# ---- Points (who wins a coalition) ---------------------------------------------------------------------------
# Seat points for a government party = round(seatMultiplier x seats / N).
points.seatMultiplier=200
# Flat points for being in the government at all, and for being in opposition.
points.governmentFloor=10
points.opposition=0
# Portfolios, numbered 1..n in display order. 'max' = how many players may hold it.
points.portfolios.1.id=PM
points.portfolios.1.label=Prime Minister
points.portfolios.1.points=100
points.portfolios.1.max=1
points.portfolios.2.id=DPM
points.portfolios.2.label=Deputy Prime Minister
points.portfolios.2.points=50
points.portfolios.2.max=2
points.portfolios.3.id=HOME
points.portfolios.3.label=Home
points.portfolios.3.points=20
points.portfolios.3.max=1
points.portfolios.4.id=DEFENCE
points.portfolios.4.label=Defence
points.portfolios.4.points=20
points.portfolios.4.max=1
points.portfolios.5.id=FINANCE
points.portfolios.5.label=Finance
points.portfolios.5.points=20
points.portfolios.5.max=1
points.portfolios.6.id=EXTERNAL
points.portfolios.6.label=External Affairs
points.portfolios.6.points=20
points.portfolios.6.max=1
points.portfolios.7.id=SPEAKER
points.portfolios.7.label=Speaker of Parliament
points.portfolios.7.points=10
points.portfolios.7.max=1
